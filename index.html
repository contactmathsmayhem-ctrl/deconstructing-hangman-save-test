<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deconstructing Hangman Save Detective</title><style>body{background:#190425;color:#fff;font-family:Arial,sans-serif;padding:24px;text-align:center}main{max-width:550px;margin:30px auto;background:#300b44;border:3px solid #b5ff30;border-radius:22px;padding:24px}h1{color:#b5ff30}button{display:block;width:100%;margin:14px 0;padding:16px;border:0;border-radius:12px;background:#b5ff30;font-size:17px;font-weight:bold}#status{font-size:22px;font-weight:bold;margin:24px 0}</style></head><body><main><h1>DECONSTRUCTING HANGMAN</h1><h2>🕵️ SAVE DETECTIVE</h2><p>Test whether Chrome remembers Miss Ballerina after closing and reopening this website.</p><div id="status">Checking...</div><button onclick="save()">SAVE MISS BALLERINA</button><button onclick="check()">CHECK SAVED GAME</button><button onclick="clearSave()">CLEAR TEST SAVE</button><p id="details"></p><small>Separate test only — no real game progress is affected.</small></main><script>const K='dh_web_save_detective_v1';function check(){try{let x=localStorage.getItem(K);document.getElementById('status').textContent=x?'SOLO SAVE: FOUND ✅':'SOLO SAVE: MISSING';document.getElementById('details').textContent=x?'Saved: '+new Date(JSON.parse(x).when).toLocaleString():'No save on this website yet.'}catch(e){document.getElementById('status').textContent='STORAGE ERROR';document.getElementById('details').textContent=e.message}}function save(){try{localStorage.setItem(K,JSON.stringify({character:'MISS BALLERINA',when:Date.now()}));check()}catch(e){document.getElementById('details').textContent='SAVE FAILED: '+e.message}}function clearSave(){localStorage.removeItem(K);check()}check();</script></body></html>
