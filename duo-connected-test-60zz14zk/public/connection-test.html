<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hangman connection test</title><style>body{background:#190c29;color:#fff;font:18px system-ui;max-width:850px;margin:30px auto;padding:20px}h1,h2{color:#b8ff15}button,input,select{font:inherit;padding:12px;margin:5px;border-radius:10px;max-width:100%;box-sizing:border-box}button{background:#b8ff15;color:#190c29;cursor:pointer}section{border:2px solid #b8ff15;padding:15px;margin:18px 0;border-radius:16px}#players{display:flex;gap:20px}#players>div{flex:1}#error{color:#ffbda8;white-space:pre-wrap}small{display:block;color:#ddd}button:disabled{opacity:.5}label{display:block}</style><h1>Private friend connection test</h1><p>This is a separate test page. The illustrated game interface is not connected yet.</p><section id="entry"><label>Nickname <input id="name" maxlength="32" autocomplete="nickname"></label><button id="create">Create match</button><label>Invite code <input id="code" maxlength="10"></label><button id="join">Join match</button><small>Open this same page in another tab, enter a second nickname and join with the code. Each tab keeps its own player identity.</small></section><p id="error" role="status"></p><main id="match" hidden><h2 id="heading"></h2><button id="leave">Leave this test</button><div id="players"></div><section id="controls"></section></main><script>
const $=id=>document.getElementById(id);let auth=JSON.parse(sessionStorage.getItem('hangman_connection_test')||'null'),state=null,busy=false,pending=null;
const characters=['MR HOBO','MR FARMER','MISS WORLD','MISS BALLERINA','THE QUEEN','MR MUSCLES','MR SURFER','MISS NIGHTLIFE'];
async function request(data){const r=await fetch('/.netlify/functions/hangman',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const body=await r.json();if(!r.ok)throw Error(body.error||'Connection error');return body;}
function save(s){if(s.token){auth={code:s.code,token:s.token};sessionStorage.setItem('hangman_connection_test',JSON.stringify(auth));}state=s;render();}
async function enter(op){try{save(await request({op,nickname:$('name').value,code:$('code').value}));$('error').textContent='';}catch(e){$('error').textContent=e.message;}}
$('create').onclick=()=>enter('create');$('join').onclick=()=>enter('join');$('leave').onclick=()=>{sessionStorage.removeItem('hangman_connection_test');auth=null;state=null;render();};
async function send(kind,extra={}){if(busy)return;busy=true;const payload={op:'action',...auth,action:{id:crypto.randomUUID(),kind,round:state.round,...extra}};try{save(await request(payload));pending=null;$('error').textContent='';}catch(e){pending=payload;$('error').textContent=e.message+' — Polling will refresh the current state.';}finally{busy=false;}}
function button(parent,text,fn){const b=document.createElement('button');b.textContent=text;b.onclick=fn;parent.append(b);return b;}
function select(parent,rows){const s=document.createElement('select');for(const [value,text]of rows){const o=document.createElement('option');o.value=value;o.textContent=text;s.append(o);}parent.append(s);return s;}
function para(parent,text){const p=document.createElement('p');p.textContent=text;parent.append(p);}
function render(){ $('entry').hidden=!!auth;$('match').hidden=!auth;if(!state)return;$('heading').textContent='Code '+state.code+' · Round '+state.round+' · '+state.phase;$('players').replaceChildren();state.players.forEach((p,i)=>{const box=document.createElement('div');para(box,p?p.name+(i===state.seat?' (you)':''):'Waiting for a friend');if(p){para(box,p.character||'Choose a character');para(box,'Slime Bucks: '+(p.balance===null?'NOT TELLING YOU!':p.balance));para(box,'Items lost: '+(p.lost.join(', ')||'none'));para(box,p.answered?'Answer locked':p.locked?'Wager locked':'');}$('players').append(box);});const c=$('controls');c.replaceChildren();const me=state.players[state.seat];
if(state.phase==='lobby'||me.next==='new'){const s=select(c,characters.map(x=>[x,x]));button(c,'Choose character',()=>send('character',{character:s.value}));}
else if(state.phase==='wager'){if(!me.locked){const w=select(c,state.availableWagers.map(([p,n])=>[p,p+' — '+n]));button(c,'Lock my wager',()=>send('lock',{part:w.value}));if(state.players.every(p=>!p.locked)){const d=select(c,['EASY','MEDIUM','HARD'].map(x=>[x,x]));d.value=state.difficulty;button(c,'Set difficulty',()=>send('difficulty',{level:d.value}));}}else para(c,'Waiting for your friend to lock their wager.');}
else if(state.phase==='question'){para(c,state.question.text);para(c,'Both players have 12 seconds from the shared question start.');state.question.answers.forEach((answer,i)=>{button(c,String.fromCharCode(65+i)+'. '+answer,()=>send('answer',{answer:i})).disabled=me.answered;});if(me.answered)para(c,'Waiting for your friend’s answer.');}
else if(state.phase==='result'){state.players.forEach(p=>para(c,p.name+' is '+(p.answer===state.question.correct?'CORRECT':'INCORRECT')));para(c,'Answer: '+state.question.answers[state.question.correct]);para(c,state.question.explanation);if(!me.closed)button(c,'Close result',()=>send('close'));else if(state.outcome===null)para(c,'Waiting for your friend to close the result.');else {para(c,state.outcome==='draw'?'Draw':state.players[state.outcome].name+' wins!');if(me.next==='choice'){button(c,'Same character',()=>send('choice',{choice:'same'}));button(c,'Choose a new character',()=>send('choice',{choice:'new'}));}else if(me.next==='confirm')button(c,'Rebuild now',()=>send('rebuild'));else if(me.next==='rebuilding'){para(c,'Rebuild test: wait at least 9.6 seconds, then continue. Visual animation belongs to the game interface.');button(c,'Rebuild finished',()=>send('ready'));}else para(c,'Waiting for your friend’s rematch choice.');}}
}
async function poll(){if(!auth||busy||document.hidden)return;busy=true;try{save(await request({op:'state',...auth}));}catch(e){$('error').textContent=e.message;}finally{busy=false;}}
render();poll();setInterval(poll,1500);document.addEventListener('visibilitychange',poll);
</script></html>
